<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WattWise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: bilah atas + panel meter gelap di Ringkasan; halaman lain berupa bagian datar dengan garis pemisah. Navigasi bawah di ponsel. */
:root{
  --bg:#EDF1EF; --surface:#F8FAF9; --field:#FFFFFF; --ink:#10201C; --ink-2:#4B5E58; --line:#CFD9D5;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --accent-soft:#D5EBE4;
  --hero-bg:#0F1F1B; --hero-fg:#EAF3EF; --hero-dim:#9DB5AD; --hero-line:#2C423B;
  --glass:#EEF1E6; --digit:#101814; --red:#D8372B;
  --good:#1B7F4B; --good-soft:#DCF0E3; --warn:#8F5600; --warn-soft:#FBEBCB; --bad:#B02E24; --bad-soft:#F9DAD6;
  --bar:#0B7A63; --bar-wk:#3D5AB8;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,sans-serif;
  --f-digit:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1311; --surface:#121D1A; --field:#0E1816; --ink:#E6F0EC; --ink-2:#97ADA6; --line:#26352F;
  --accent:#3FCFAF; --accent-ink:#06231C; --accent-soft:#143A31;
  --hero-bg:#17292A; --hero-fg:#EAF3EF; --hero-dim:#9DB5AD; --hero-line:#33504B;
  --good:#5FD596; --good-soft:#123A26; --warn:#F0B54A; --warn-soft:#3D2E0D; --bad:#FF8A7D; --bad-soft:#432019;
  --bar:#3FCFAF; --bar-wk:#8EA2F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1311; --surface:#121D1A; --field:#0E1816; --ink:#E6F0EC; --ink-2:#97ADA6; --line:#26352F;
  --accent:#3FCFAF; --accent-ink:#06231C; --accent-soft:#143A31;
  --hero-bg:#17292A; --hero-fg:#EAF3EF; --hero-dim:#9DB5AD; --hero-line:#33504B;
  --good:#5FD596; --good-soft:#123A26; --warn:#F0B54A; --warn-soft:#3D2E0D; --bad:#FF8A7D; --bad-soft:#432019;
  --bar:#3FCFAF; --bar-wk:#8EA2F0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.375rem;font-weight:700}
h3{font-size:1.0625rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* bilah atas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;padding-block:.7rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:.55rem;font:700 1.3rem/1 var(--f-display);letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px;flex:none}
.desk{display:flex;gap:.25rem;margin-left:auto}
.desk a{padding:.4rem .8rem;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:500}
.desk a:hover{color:var(--ink)}
.desk a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:.3rem max(6px,env(safe-area-inset-right,0px)) calc(.3rem + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabbar a{display:grid;justify-items:center;gap:.15rem;padding:.35rem .1rem;font-size:.72rem;font-weight:500;color:var(--ink-2);text-decoration:none;border-radius:8px}
.tabbar svg{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--accent)}
@media (max-width:760px){.desk{display:none}.tabbar{display:grid}.top-in{justify-content:space-between}}

.wrap{max-width:1120px;margin:0 auto;padding-block:1.5rem 3.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:760px){.wrap{padding-bottom:6.5rem}}
.page{display:grid;gap:2.75rem}
.sec{display:grid;gap:1rem;min-width:0;align-content:start}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.tnum{font-variant-numeric:tabular-nums}

/* catatan data contoh */
.note{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:.8rem 1rem;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.note p{max-width:60ch}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:16px;padding:clamp(1.25rem,3vw,2rem);display:grid;gap:1.75rem}
.hero-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:2rem;align-items:end}
@media (max-width:820px){.hero-top{grid-template-columns:minmax(0,1fr)}}
.hero-k{color:var(--hero-dim);font-weight:500;margin-bottom:.7rem}
.odo-row{display:flex;align-items:flex-end;gap:.75rem;flex-wrap:wrap}
.odo{display:inline-flex;gap:.3rem;align-items:center;font:500 clamp(2.4rem,9vw,4rem)/1 var(--f-digit)}
.dg{display:block;height:1.2em;overflow:hidden;background:var(--glass);color:var(--digit);border-radius:4px;padding:0 .13em}
.dg.dec{background:var(--red);color:#fff}
.strip{display:flex;flex-direction:column;transform:translateY(calc(var(--d)*-1.2em));transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.strip b{display:block;height:1.2em;line-height:1.2em;font-weight:500}
.odo .sep{font-size:1em;color:var(--hero-fg);margin:0 -.05em}
.unit{font:700 1.4rem/1 var(--f-display);padding-bottom:.35rem}
.hero-sub{color:var(--hero-dim);margin-top:.8rem}
.figs{margin:0;display:grid;gap:1.1rem}
.figs div{display:grid;gap:.15rem}
.figs dt{color:var(--hero-dim);font-weight:500}
.figs dd{margin:0;font:700 clamp(1.5rem,4.5vw,2.1rem)/1.1 var(--f-display);display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .65rem;border-radius:999px;font:600 .8125rem/1.3 var(--f-body)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.hero .pill.good{background:#173E2B;color:#7FE0A8}.hero .pill.warn{background:#4A3510;color:#F4C262}.hero .pill.bad{background:#512620;color:#FF9C90}
.budget{display:grid;gap:.7rem}
.track{position:relative;height:12px;border-radius:999px;background:var(--hero-line);overflow:visible}
.track .proj,.track .spent{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.track .proj{background:repeating-linear-gradient(135deg,#6E8B83 0 4px,#3F5A52 4px 8px)}
.track .spent{background:var(--accent)}
.track .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--hero-fg);border-radius:2px}
.legend{display:flex;gap:.4rem 1.4rem;flex-wrap:wrap;font-size:.875rem;color:var(--hero-dim)}
.legend span{display:inline-flex;align-items:center;gap:.45rem}
.sw-box{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.legend b{color:var(--hero-fg);font-weight:600}

/* grafik harian */
.chart{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:.4rem .6rem}
.yaxis{position:relative;height:190px;font-size:.75rem;color:var(--ink-2);text-align:right}
.yaxis span{position:absolute;right:0;transform:translateY(50%)}
.plot{position:relative;height:190px;border-bottom:1px solid var(--line)}
.plot .gl{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.6}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px;align-items:end}
.bar{all:unset;box-sizing:border-box;height:100%;display:flex;align-items:flex-end;cursor:pointer}
.bar span{display:block;width:100%;height:var(--h);min-height:2px;background:var(--bar);border-radius:3px 3px 0 0}
.bar.wk span{background:var(--bar-wk)}
.bar.none span{height:2px;background:var(--line)}
.bar:hover span,.bar:focus-visible span,.bar.sel span{filter:brightness(1.25);outline:2px solid var(--ink);outline-offset:1px}
.target{position:absolute;left:0;right:0;border-top:2px dashed var(--ink-2);pointer-events:none}
.xaxis{grid-column:2;display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-2)}
.chart-foot{grid-column:1/-1;display:flex;gap:.5rem 1.5rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.readout{min-height:1.5em;font-weight:500}
.key{display:flex;gap:.4rem 1.2rem;flex-wrap:wrap;font-size:.8125rem;color:var(--ink-2)}
.key span{display:inline-flex;align-items:center;gap:.4rem}
.dash{width:18px;border-top:2px dashed var(--ink-2);display:inline-block}
@media (max-width:520px){.bars{gap:2px}.chart{grid-template-columns:2rem minmax(0,1fr);gap:.4rem .4rem}}
.empty{padding:2rem 1rem;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--ink-2)}

/* dua kolom */
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:2.5rem}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.segs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.segs button{all:unset;box-sizing:border-box;padding:.3rem .9rem;border-radius:999px;cursor:pointer;font-weight:500;font-size:.875rem;color:var(--ink-2)}
.segs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.segs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shares{list-style:none;margin:0;padding:0;display:grid;gap:.85rem}
.shares li{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:.2rem .9rem;align-items:center}
.shares .nm{font-weight:500;overflow-wrap:anywhere}
.shares .nm small{display:block;color:var(--ink-2);font-weight:400}
.shares .meter{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.shares .meter i{display:block;height:100%;background:var(--bar);border-radius:999px}
.shares .nums{text-align:right;font-size:.875rem;white-space:nowrap}
.shares .nums b{font-weight:600}
@media (max-width:520px){.shares li{grid-template-columns:minmax(0,1fr) auto}.shares .meter{grid-column:1/-1;order:3}}
.facts{margin:0;display:grid;gap:0}
.facts div{display:flex;justify-content:space-between;gap:1rem;padding:.65rem 0;border-bottom:1px solid var(--line)}
.facts div:first-child{border-top:1px solid var(--line)}
.facts dt{color:var(--ink-2)}
.facts dd{margin:0;font-weight:600;text-align:right}

.tips{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tips li{display:grid;gap:.25rem;padding:1rem 0;border-top:1px solid var(--line)}
.tips li:last-child{border-bottom:1px solid var(--line)}
.tips .save{justify-self:start;margin-top:.25rem;padding:.15rem .6rem;border-radius:999px;background:var(--accent-soft);font-size:.8125rem;font-weight:600}

/* formulir */
.form{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr));align-items:end}
.form .wide{grid-column:1/-1}
.field{display:grid;gap:.3rem;min-width:0}
.field label,.seg legend{font-weight:500;font-size:.9rem}
.field input,.field select{width:100%;min-width:0;padding:.6rem .75rem;border:1px solid var(--line);border-radius:8px;background:var(--field);min-height:44px}
.field .hint{font-size:.8125rem;color:var(--ink-2)}
.seg{border:0;padding:0;margin:0;display:flex;gap:.5rem;flex-wrap:wrap}
.seg legend{padding:0;margin-bottom:.3rem;width:100%}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:inline-block;padding:.5rem .9rem;border:1px solid var(--line);border-radius:999px;background:var(--field);cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.55rem 1.1rem;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:.3rem .8rem;font-size:.875rem}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.err{color:var(--bad);font-weight:500;min-height:1.2em;grid-column:1/-1}
.panel{padding:1.25rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;gap:1rem}

/* daftar perangkat */
.aps{list-style:none;margin:0;padding:0}
.aps li,.aps .hd{display:grid;grid-template-columns:minmax(0,2.2fr) .9fr .7fr .9fr 1.1fr 3.4rem auto;gap:.5rem 1rem;align-items:center;padding:.75rem 0;border-top:1px solid var(--line)}
.aps .hd{font-size:.8125rem;color:var(--ink-2);font-weight:500;padding:.4rem 0;border-top:0}
.aps li:last-child{border-bottom:1px solid var(--line)}
.aps .nm{font-weight:600;overflow-wrap:anywhere}
.aps .nm small{display:block;font-weight:400;color:var(--ink-2)}
.aps .acts{display:flex;gap:.4rem;justify-content:flex-end}
.aps li.off{opacity:.55}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(18px)}
@media (max-width:860px){
  .aps .hd{display:none}
  .aps li{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm sw" "p p" "acts acts"}
  .aps li .nm{grid-area:nm}.aps li .swc{grid-area:sw}.aps li .acts{grid-area:acts;justify-content:flex-start}
  .aps li .c{display:none}
  .aps li .p{grid-area:p;display:block;color:var(--ink-2);font-size:.9rem}
}
.aps .p{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.loadbar{position:relative;height:12px;border-radius:999px;background:var(--line);overflow:visible}
.loadbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--good)}
.loadbar.warn i{background:var(--warn)}.loadbar.bad i{background:var(--bad)}
.loadbar b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px}
.sim-out{font-weight:600;font-size:1.05rem}
.range{width:100%;accent-color:var(--accent);min-height:32px}

table{width:100%;border-collapse:collapse}
.tblwrap{overflow-x:auto}
th,td{text-align:left;padding:.6rem .7rem;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--ink-2);font-size:.875rem;border-top:0}
td.r,th.r{text-align:right}

.toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-weight:500;z-index:40;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){.toast{bottom:calc(5rem + env(safe-area-inset-bottom,0px))}}
/* status sinkron, panel langsung */
.sync{display:inline-flex;align-items:center;gap:.4rem;font-size:.8125rem;color:var(--ink-2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:inline-block}
.sync.ok i{background:var(--good)}.sync.busy i{background:var(--warn)}.sync.err i{background:var(--bad)}
@media (max-width:420px){.sync{font-size:.75rem}.brand{font-size:1.15rem}}
.live-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5rem}
.live-top p{margin:0}
.live-top>div{display:grid;gap:.35rem;align-content:start;min-width:0}
@media (max-width:700px){.live-top{grid-template-columns:minmax(0,1fr)}}
.live-big{font:700 clamp(2rem,7vw,3rem)/1.05 var(--f-display)}
.dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative;display:inline-block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;gap:.45rem;align-items:center;padding:.45rem .85rem;border:1px solid var(--line);border-radius:999px;background:var(--field);font-weight:500}
.chip small{color:var(--ink-2);font-weight:400}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:checked+span small{color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.devs{display:flex;flex-wrap:wrap;gap:.5rem}
.dv{display:inline-flex;gap:.45rem;align-items:center;padding:.4rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--ink-2)}
.dv small{font-size:.8125rem}
.dv i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.dv.on{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:500}
.dv.on i{background:var(--accent)}
</style>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#ringkasan" aria-label="WattWise, ke Ringkasan">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="var(--accent)"/><path d="M12.95 43A22 22 0 1 1 51.05 43" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/><path d="M35.6 16.5 24.2 34h6.9l-2.6 11.5L40 28h-6.9z" fill="#EEF1E6" stroke="#EEF1E6" stroke-width="1.2" stroke-linejoin="round"/><circle cx="32" cy="53" r="3" fill="#D8372B"/></svg>
      WattWise
    </a>
    <nav class="desk" id="deskNav" aria-label="Menu utama"></nav>
    <span class="sync" id="syncState" role="status"></span>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="Ganti tema terang atau gelap"></button>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1"></main>
<nav class="tabbar" id="tabNav" aria-label="Menu utama"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var KEY="wattwise:v1", THEME_KEY="wattwise:theme";
var MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
var MONF=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var DOW=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];

/* ---------- util ---------- */
function pad(n){return String(n).padStart(2,"0")}
function toYMD(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fromYMD(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=fromYMD(s);d.setDate(d.getDate()+n);return toYMD(d)}
function diffDays(a,b){return Math.round((fromYMD(a)-fromYMD(b))/864e5)}
function daysIn(y,m){return new Date(y,m,0).getDate()}
function sum(a){var t=0;for(var i=0;i<a.length;i++)t+=a[i];return t}
function nf(n,d){if(d===undefined)d=1;return Number(n).toLocaleString("id-ID",{minimumFractionDigits:d,maximumFractionDigits:d})}
function rp(n){return "Rp "+Math.round(n).toLocaleString("id-ID")}
function fmtD(s){var d=fromYMD(s);return d.getDate()+" "+MON[d.getMonth()]}
function fmtDD(s){var d=fromYMD(s);return DOW[d.getDay()]+", "+d.getDate()+" "+MON[d.getMonth()]}
function val(n){return String(n).replace(".",",")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(v){
  var s=String(v).trim().replace(/\s/g,"");
  if(!s)return NaN;
  if(s.indexOf(",")>-1)s=s.replace(/\./g,"").replace(",",".");
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,"");
  else if(/^\d{1,3}\.\d{3}$/.test(s))s=s.replace(".","");
  return Number(s);
}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rid(){return "a"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}

function calc(){
  var s=S.settings,unit=s.tariff*(1+s.ppj/100);
  var ln=liveNow(),today=toYMD(new Date()),cur=today.slice(0,7),Y=+cur.slice(0,4),M=+cur.slice(5,7),dim=daysIn(Y,M),dayNo=+today.slice(8);
  var done=S.readings.filter(function(x){return x.kwh!=null&&x.date<today}).sort(function(a,b){return a.date<b.date?-1:1});
  var r0=null;S.readings.forEach(function(x){if(x.date===today&&x.kwh!=null)r0=x});
  var todayLive=!r0&&ln.kwh>0,todayVal=r0?r0.kwh:ln.kwh;
  var rs=done.slice();
  if(r0)rs.push(r0);else if(todayLive)rs.push({date:today,kwh:ln.kwh,src:"live"});
  var mtd=sum(rs.filter(function(x){return x.date.slice(0,7)===cur}).map(function(x){return x.kwh}));
  var mtdDone=sum(done.filter(function(x){return x.date.slice(0,7)===cur}).map(function(x){return x.kwh}));
  var lastDate=rs.length?rs[rs.length-1].date:null;
  var l7=done.slice(-7),avg7=l7.length?sum(l7.map(function(x){return x.kwh}))/l7.length:0;
  var real=l7.filter(function(x){return x.src!=="auto"}),real7=real.length>=3?sum(real.map(function(x){return x.kwh}))/real.length:0;
  var ap=S.appliances.map(function(a){var o=Object.assign({},a);o.kwhDay=a.on?a.watt*a.qty*Math.min(24,a.hours)/1000:0;return o});
  var modelDay=sum(ap.map(function(a){return a.kwhDay}));
  var peak=sum(ap.filter(function(a){return a.on}).map(function(a){return a.watt*a.qty}));
  var limit=s.va*s.pf;
  var base=avg7>0?avg7:modelDay,remaining=dim-dayNo,left=remaining+1;
  var proj=mtdDone+Math.max(todayVal,base)+base*remaining;
  var pm=M===1?(Y-1)+"-12":Y+"-"+pad(M-1);
  var prevRows=done.filter(function(x){return x.date.slice(0,7)===pm});
  var prevTotal=sum(prevRows.map(function(x){return x.kwh}));
  var prevSame=sum(prevRows.filter(function(x){return +x.date.slice(8)<dayNo}).map(function(x){return x.kwh}));
  var l28=done.slice(-28),wk=[],wd=[];
  l28.forEach(function(x){var g=fromYMD(x.date).getDay();(g===0||g===6?wk:wd).push(x.kwh)});
  var wkAvg=wk.length?sum(wk)/wk.length:0,wdAvg=wd.length?sum(wd)/wd.length:0;
  var budget=s.budget||0,budgetKwh=budget/unit,projCost=proj*unit,mtdCost=mtd*unit;
  var ratio=budget>0?projCost/budget:0;
  var status=ratio>1?"bad":(ratio>=s.alertPct/100?"warn":"good");
  var tdaily=left>0?Math.max(0,budgetKwh-mtdDone)/left:0;
  return {unit:unit,rs:rs,today:today,cur:cur,Y:Y,M:M,dim:dim,mtd:mtd,mtdDone:mtdDone,mtdCost:mtdCost,lastDate:lastDate,avg7:avg7,real7:real7,remaining:remaining,left:left,proj:proj,projCost:projCost,prevTotal:prevTotal,prevSame:prevSame,wkAvg:wkAvg,wdAvg:wdAvg,budget:budget,budgetKwh:budgetKwh,ratio:ratio,status:status,targetDaily:tdaily,ap:ap,modelDay:modelDay,peak:peak,limit:limit,live:ln.kwh,todayLive:todayLive};
}

function tipsList(c){
  var out=[],pct=function(x){return nf(x,0)+"%"};
  if(c.budget>0&&c.status!=="good"&&c.left>0){
    out.push({t:"Atur pemakaian harian agar tagihan sesuai anggaran",b:"Sisa bulan ini sebaiknya tidak lebih dari "+nf(c.targetDaily,1)+" kWh per hari. Rata-rata 7 hari terakhir "+nf(c.avg7,1)+" kWh."});
  }
  if(c.peak>c.limit){
    var top3=c.ap.filter(function(a){return a.on}).sort(function(a,b){return b.watt*b.qty-a.watt*a.qty}).slice(0,3).map(function(a){return a.n});
    out.push({t:"Hindari menyalakan perangkat besar bersamaan",b:"Total daya semua perangkat aktif "+nf(c.peak,0)+" W, di atas batas sekitar "+nf(c.limit,0)+" W. Beban jarang menyala sekaligus, tetapi pisahkan penggunaan "+top3.join(", ")+"."});
  }
  var top=c.ap.slice().sort(function(a,b){return b.kwhDay-a.kwhDay})[0];
  if(top&&top.kwhDay>0&&c.modelDay>0){
    var share=top.kwhDay/c.modelDay;
    if(/\bAC\b/i.test(top.n)){
      out.push({t:"Naikkan setelan suhu "+top.n,b:top.n+" menyumbang "+pct(share*100)+" dari perkiraan pemakaian. Tiap kenaikan 1°C pada setelan suhu umumnya menghemat sekitar 3 sampai 5% konsumsi AC.",s:top.kwhDay*30*0.04*c.unit});
    }else{
      out.push({t:"Kurangi "+top.n+" 30 menit per hari",b:top.n+" menyumbang "+pct(share*100)+" dari perkiraan pemakaian, yang terbesar di rumah ini.",s:top.watt*top.qty*0.5/1000*30*c.unit});
    }
  }
  if(c.wkAvg&&c.wdAvg&&c.wkAvg>c.wdAvg*1.2){
    out.push({t:"Akhir pekan lebih boros",b:"Rata-rata akhir pekan "+nf(c.wkAvg,1)+" kWh, "+pct((c.wkAvg/c.wdAvg-1)*100)+" di atas hari kerja. Sebar mencuci dan menyetrika ke hari kerja."});
  }
  return out.slice(0,4);
}
/* ---------- pemakaian otomatis dari jadwal perangkat ---------- */
function hm(s){var p=String(s).split(":");return (+p[0])+(+p[1]||0)/60}
/* daya (W) pada jam ke-t hari itu (0 sampai 24). Tanpa jam mulai: dianggap menyala sepanjang hari pada daya rata-rata. */
function pw(a,t){
  var W=a.watt*a.qty,h=Math.min(24,a.hours);
  if(!a.on||!(h>0))return 0;
  if(h>=24||!a.start)return W*h/24;
  var s=hm(a.start);
  return ((t>=s&&t<s+h)||t<s+h-24)?W:0;
}
/* energi (kWh) dari pukul 00:00 sampai jam ke-t. Jadwal yang melewati tengah malam terbagi ke dua hari. */
function energyTo(a,t){
  var W=a.watt*a.qty,h=Math.min(24,a.hours);
  if(!a.on||!(h>0))return 0;
  if(h>=24||!a.start)return W*h/24*t/1000;
  var s=hm(a.start);
  function ov(x,y){return Math.max(0,Math.min(y,t)-Math.max(x,0))}
  return W*(ov(s,s+h)+ov(s-24,s+h-24))/1000;
}
function liveNow(){
  var n=new Date(),hrs=(n-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/3.6e6,w=0,k=0;
  S.appliances.forEach(function(a){w+=pw(a,hrs);k+=energyTo(a,hrs)});
  return {watt:w,kwh:k,hrs:hrs};
}
function schedTxt(a){return (a.hours>=24||!a.start)?"sepanjang hari":"mulai "+a.start}
function lastReadingDate(){var m="";S.readings.forEach(function(r){if(r.date>m)m=r.date});return m}
/* Memasukkan total hari yang sudah lewat ke Catatan. Berjalan saat halaman dibuka, saat pukul 00:00, dan sebelum jadwal perangkat diubah.
   Catatan yang sudah ada (manual atau dari meter) tidak pernah ditimpa. */
function settle(){
  var today=toYMD(new Date()),yest=addDays(today,-1),changed=false;
  if(!S.settledTo){var lr=lastReadingDate();S.settledTo=(lr&&lr<yest)?lr:yest;changed=true}
  var span=diffDays(yest,S.settledTo);
  if(span>62){S.settledTo=addDays(yest,-62);span=62;changed=true}
  if(span>0){
    var v=Math.round(sum(S.appliances.map(function(a){return energyTo(a,24)}))*100)/100;
    for(var i=1;i<=span;i++){
      var d=addDays(S.settledTo,i),ex=null;
      S.readings.forEach(function(r){if(r.date===d)ex=r});
      if(ex&&ex.kwh!=null)continue;
      if(v<=0)continue;
      if(ex){ex.kwh=v;ex.src="auto"}else S.readings.push({date:d,kwh:v,src:"auto"});
    }
    S.settledTo=yest;changed=true;
  }
  return changed;
}

   +'<div class="devs" id="live-devs" aria-label="Status perangkat saat ini"></div>'

}
function heroSub(c){
  var delta="";
  if(c.prevSame>0&&c.mtdDone>0){var p=(c.mtdDone/c.prevSame-1)*100;delta=", "+(p>=0?"naik ":"turun ")+nf(Math.abs(p),0)+"% dari periode yang sama bulan lalu"}
  if(!c.lastDate)return "Belum ada pemakaian. Tambahkan perangkat di tab Perangkat.";
  return (c.todayLive?"Termasuk hari ini yang masih berjalan":"Tercatat sampai "+fmtD(c.lastDate))+delta;
}
function budHTML(c){
  if(!(c.budget>0))return "";
  var scale=Math.max(c.budget,c.projCost,c.mtdCost,1)*1.06;
  return '<div class="budget"><div class="track" role="img" aria-label="Terpakai '+rp(c.mtdCost)+', proyeksi '+rp(c.projCost)+', anggaran '+rp(c.budget)+'"><div class="proj" style="width:'+(c.projCost/scale*100)+'%"></div><div class="spent" style="width:'+(c.mtdCost/scale*100)+'%"></div><div class="mark" style="left:'+(c.budget/scale*100)+'%"></div></div>'
    +'<div class="legend tnum"><span><i class="sw-box" style="background:var(--accent)"></i>Terpakai <b>'+rp(c.mtdCost)+'</b></span><span><i class="sw-box" style="background:repeating-linear-gradient(135deg,#6E8B83 0 3px,#3F5A52 3px 6px)"></i>Proyeksi <b>'+rp(c.projCost)+'</b></span><span><i class="sw-box" style="background:var(--hero-fg);width:3px"></i>Anggaran <b>'+rp(c.budget)+'</b></span></div></div>';
}
function refreshHero(){
  var sub=document.getElementById("hz-sub");if(!sub)return;
  var c=calc();
  document.getElementById("hz-mtd").textContent=rp(c.mtdCost);
  document.getElementById("hz-proj").innerHTML=rp(c.projCost)+(c.budget>0?" "+pill(c.status):"");
  document.getElementById("hz-bud").innerHTML=budHTML(c);
  sub.textContent=heroSub(c);
  var t=String(Math.min(99999,Math.round(c.mtd*10))).padStart(5,"0");
  document.querySelectorAll(".odo .strip").forEach(function(s,i){var d=+t[i];if(+s.dataset.d!==d){s.dataset.d=d;s.style.setProperty("--d",d)}});
  var o=document.querySelector(".odo");if(o)o.setAttribute("aria-label",nf(c.mtd,1)+" kWh");
}
function refreshChart(){
  var box=document.getElementById("chart-box");if(!box)return;
  var ae=document.activeElement;
  if(box.querySelector(".bar.sel")||(ae&&box.contains(ae)))return;
  box.innerHTML=chartHTML(calc());
}

  var sub=heroSub(c),bud=budHTML(c);

  var cal="";

  }
  return '<div class="page">'+banner
  +'<section class="hero" aria-label="Pemakaian bulan ini"><div class="hero-top"><div><p class="hero-k">Pemakaian '+MONF[c.M-1]+' '+c.Y+'</p><div class="odo-row">'+odo(c.mtd)+'<span class="unit">kWh</span></div><p class="hero-sub" id="hz-sub">'+esc(sub)+'</p></div>'
  +'<dl class="figs"><div><dt>Tagihan sejauh ini</dt><dd class="tnum" id="hz-mtd">'+rp(c.mtdCost)+'</dd></div><div><dt>Proyeksi akhir bulan</dt><dd class="tnum" id="hz-proj">'+rp(c.projCost)+(c.budget>0?" "+pill(c.status):"")+'</dd></div></dl></div><div id="hz-bud">'+bud+'</div></section>'
  +liveHTML(c)+'<section class="sec" aria-labelledby="h-chart"><div class="sec-head"><h2 id="h-chart">30 hari terakhir</h2><a class="small" href="#catatan">Tambah catatan</a></div><div id="chart-box">'+chartHTML(c)+'</div></section>'
  +'<div class="cols"><section class="sec" aria-labelledby="h-share"><div class="sec-head"><h2 id="h-share">Ke mana listrik terpakai</h2><div class="segs" role="group" aria-label="Kelompokkan"><button type="button" data-action="share" data-v="device" aria-pressed="'+(shareMode==="device")+'">Perangkat</button><button type="button" data-action="share" data-v="room" aria-pressed="'+(shareMode==="room")+'">Ruangan</button></div></div>'+sharesHTML(c)+cal+'</section>'
  +'<section class="sec" aria-labelledby="h-facts"><h2 id="h-facts">Pola pemakaian</h2><dl class="facts tnum">'
  +'<div><dt>Rata-rata hari kerja</dt><dd>'+(c.wdAvg?nf(c.wdAvg,1)+" kWh":"-")+'</dd></div>'
  +'<div><dt>Rata-rata akhir pekan</dt><dd>'+(c.wkAvg?nf(c.wkAvg,1)+" kWh":"-")+'</dd></div>'
  +'<div><dt>Rata-rata 7 hari terakhir</dt><dd>'+(c.avg7?nf(c.avg7,1)+" kWh":"-")+'</dd></div>'
  +'<div><dt>Total bulan lalu</dt><dd>'+(c.prevTotal?nf(c.prevTotal,0)+" kWh, "+rp(c.prevTotal*c.unit):"-")+'</dd></div>'
  +'<div><dt>Tarif yang dipakai</dt><dd>'+rp(S.settings.tariff)+'/kWh</dd></div></dl>'
  +'<p class="muted small">Tarif dan PPJ bisa diubah di <a href="#pengaturan">Pengaturan</a> agar sama dengan struk atau aplikasi PLN Anda.</p></section></div>'
  +'<section class="sec" aria-labelledby="h-tips"><h2 id="h-tips">Saran hemat</h2>'+tipsH+'</section></div>';
}

/* ---------- Perangkat ---------- */
var editId=null;
function loadHTML(c){
  var r=c.limit>0?c.peak/c.limit:0,cls=r<=1?"":(r<=1.6?"warn":"bad");
  var sc=Math.max(c.peak,c.limit,1)*1.08;
  var msg=r<=1?"Jika semua perangkat aktif menyala bersamaan, bebannya masih di bawah batas daya.":"Jika semua perangkat aktif menyala bersamaan, bebannya melewati batas daya. Dalam pemakaian nyata jarang bersamaan, tetapi hindari menyalakan perangkat besar sekaligus.";
  return '<div class="sec"><div class="loadbar '+cls+'" role="img" aria-label="Beban total '+nf(c.peak,0)+' W, batas '+nf(c.limit,0)+' W"><i style="width:'+(c.peak/sc*100)+'%"></i><b style="left:'+(c.limit/sc*100)+'%"></b></div>'
   +'<p class="tnum"><strong>'+nf(c.peak,0)+' W</strong> dari batas sekitar <strong>'+nf(c.limit,0)+' W</strong> <span class="muted">('+nf(S.settings.va,0)+' VA × cos φ '+val(S.settings.pf)+')</span></p><p class="muted small">'+msg+'</p></div>';
}
function viewPerangkat(c){
  var e=S.appliances.filter(function(a){return a.id===editId})[0];
  var rooms=[];S.appliances.forEach(function(a){if(a.room&&rooms.indexOf(a.room)<0)rooms.push(a.room)});
  var form='<form class="form panel" data-form="ap" novalidate><h3 class="wide">'+(e?"Ubah perangkat":"Tambah perangkat")+'</h3>'
   +'<div class="field"><label for="ap-n">Nama perangkat</label><input id="ap-n" name="n" autocomplete="off" value="'+(e?esc(e.n):"")+'" placeholder="Contoh: Dispenser"></div>'
   +'<div class="field"><label for="ap-room">Ruangan</label><input id="ap-room" name="room" list="rooms" autocomplete="off" value="'+(e?esc(e.room):"")+'" placeholder="Contoh: Dapur"><datalist id="rooms">'+rooms.map(function(r){return '<option value="'+esc(r)+'">'}).join("")+'</datalist></div>'
   +'<div class="field"><label for="ap-watt">Daya (watt)</label><input id="ap-watt" name="watt" inputmode="decimal" value="'+(e?val(e.watt):"")+'" placeholder="350"></div>'
   +'<div class="field"><label for="ap-qty">Jumlah unit</label><input id="ap-qty" name="qty" inputmode="numeric" value="'+(e?e.qty:1)+'"></div>'
   +'<div class="field"><label for="ap-hours">Jam pakai per hari</label><input id="ap-hours" name="hours" inputmode="decimal" value="'+(e?val(e.hours):"")+'" placeholder="2,5"></div>'
   +'<div class="field"><label for="ap-start">Mulai menyala jam</label><input id="ap-start" name="start" type="time" value="'+(e?esc(e.start||""):"18:00")+'"><span class="hint">Kosongkan jika menyala sepanjang hari, misalnya kulkas atau router.</span></div>'
   +'<div class="wide field"><span class="hint">Daya ada di label perangkat. Jika hanya tertulis ampere: daya ≈ 220 V × arus × cos φ. Untuk kulkas, isi jam saat kompresor menyala.</span></div>'
   +'<div class="wide" style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="btn" type="submit">'+(e?"Simpan perubahan":"Tambah perangkat")+'</button>'+(e?'<button class="btn ghost" type="button" data-action="ap-cancel">Batal</button>':"")+'</div><p class="err" role="alert"></p></form>';
  var list=S.appliances.length?'<ul class="aps"><li class="hd" aria-hidden="true"><span>Perangkat</span><span>Daya</span><span>Jam/hari</span><span>kWh/bulan</span><span>Biaya/bulan</span><span>Aktif</span><span></span></li>'
   +S.appliances.map(function(a){
      var k=a.watt*a.qty*a.hours/1000*30;
      return '<li class="'+(a.on?"":"off")+'"><div class="nm">'+esc(a.n)+'<small>'+esc(a.room||"Tanpa ruangan")+'</small></div>'
       +'<span class="c tnum">'+nf(a.watt,0)+' W × '+a.qty+'</span><span class="c tnum">'+nf(a.hours,1)+' jam<small class="muted" style="display:block">'+schedTxt(a)+'</small></span><span class="c tnum">'+nf(k,1)+' kWh</span><span class="c tnum">'+rp(k*c.unit)+'</span>'
       +'<span class="p tnum">'+nf(a.watt,0)+' W × '+a.qty+', '+nf(a.hours,1)+' jam per hari ('+schedTxt(a)+'), '+nf(k,1)+' kWh dan '+rp(k*c.unit)+' per bulan</span>'
       +'<span class="swc"><input class="sw" type="checkbox" role="switch" data-action-change="ap-toggle" data-id="'+a.id+'" '+(a.on?"checked":"")+' aria-label="Aktifkan '+esc(a.n)+'"></span>'
       +'<span class="acts"><button type="button" class="btn ghost sm" data-action="ap-edit" data-id="'+a.id+'">Ubah</button><button type="button" class="btn danger sm" data-action="ap-del" data-id="'+a.id+'" data-confirm="Klik lagi">Hapus</button></span></li>';
    }).join("")+"</ul>":'<div class="empty">Belum ada perangkat. Isi formulir di bawah untuk menambahkan yang pertama.</div>';
  var active=S.appliances.filter(function(a){return a.on});
  var sim=active.length?'<section class="sec" aria-labelledby="h-sim"><h2 id="h-sim">Simulasi hemat</h2><div class="panel"><div class="form"><div class="field"><label for="sim-ap">Perangkat</label><select id="sim-ap">'+active.map(function(a){return '<option value="'+a.id+'">'+esc(a.n)+'</option>'}).join("")+'</select></div>'
    +'<div class="field wide"><label for="sim-h">Jam pakai per hari: <span id="sim-hv"></span></label><input class="range" id="sim-h" type="range" min="0" max="24" step="0.25"></div></div><p class="sim-out tnum" id="sim-out" aria-live="polite"></p><div><button class="btn" type="button" data-action="sim-apply">Terapkan jam pakai ini</button></div></div></section>':"";
  return '<div class="page"><section class="sec" aria-labelledby="h-ap"><div class="sec-head"><h2 id="h-ap">Perangkat di rumah</h2><p class="muted tnum">'+active.length+' aktif, '+nf(c.modelDay,1)+' kWh per hari, '+rp(c.modelDay*30*c.unit)+' per bulan</p></div>'+list+'</section>'
   +'<section class="sec" aria-labelledby="h-load"><h2 id="h-load">Beban terhadap daya terpasang</h2>'+loadHTML(c)+'</section>'
   +sim+'<section class="sec" id="ap-form-sec">'+form+'</section></div>';
}
function simUpdate(){
  var sel=document.getElementById("sim-ap"),rng=document.getElementById("sim-h");if(!sel||!rng)return;
  var a=S.appliances.filter(function(x){return x.id===sel.value})[0];if(!a)return;
  var c=calc(),nh=+rng.value,dk=a.watt*a.qty*(a.hours-nh)/1000*30;
  document.getElementById("sim-hv").textContent=nf(nh,2).replace(/,00$/,"").replace(/(,\d)0$/,"$1")+" jam (sekarang "+nf(a.hours,1)+" jam)";
  var o=document.getElementById("sim-out");
  if(Math.abs(dk)<0.005)o.textContent="Geser untuk melihat selisih biaya per bulan.";
  else o.textContent=(dk>0?"Hemat ":"Tambah ")+nf(Math.abs(dk),1)+" kWh atau "+rp(Math.abs(dk)*c.unit)+" per bulan";
}
function simSync(){
  var sel=document.getElementById("sim-ap"),rng=document.getElementById("sim-h");if(!sel||!rng)return;
  var a=S.appliances.filter(function(x){return x.id===sel.value})[0];if(!a)return;
  rng.value=a.hours;simUpdate();
}

/* ---------- Catatan ---------- */
function exportHTML(mk){
  if(!dl||!mk.length)return "";
  return '<section class="sec" aria-labelledby="h-ex"><h2 id="h-ex">Laporan bulanan</h2><div class="panel"><div class="form"><div class="field"><label for="ex-m">Bulan</label><select id="ex-m">'+mk.map(function(k){return '<option value="'+k+'">'+MONF[+k.slice(5)-1]+' '+k.slice(0,4)+'</option>'}).join("")+'</select></div><div><button type="button" class="btn" data-action="export">Unduh laporan (CSV)</button></div></div><p class="muted small">Berisi catatan harian, total dan biaya, perbandingan dengan anggaran, serta daftar perangkat. Bisa dibuka di Excel atau Google Sheets.</p></div></section>';
}
function viewCatatan(c){
  var form='<form class="form panel" data-form="rd" novalidate><h3 class="wide">Koreksi dengan angka meter</h3>'
   +'<div class="field"><label for="rd-date">Tanggal</label><input id="rd-date" name="date" type="date" value="'+c.today+'" max="'+c.today+'"></div>'
   +'<fieldset class="seg wide"><legend>Yang Anda isi</legend><label><input type="radio" name="mode" value="daily" checked><span>Pemakaian hari itu</span></label><label><input type="radio" name="mode" value="stand"><span>Angka di meter</span></label></fieldset>'
   +'<div class="field"><label for="rd-val" id="rd-lab">Pemakaian (kWh)</label><input id="rd-val" name="val" inputmode="decimal" autocomplete="off" placeholder="8,5"></div>'
   +'<div class="wide field"><span class="hint" id="rd-hint">Isi total kWh yang terpakai pada tanggal itu.</span></div>'
   +'<div class="wide"><button class="btn" type="submit">Simpan catatan</button></div><p class="err" role="alert"></p></form>';
  var months={};
  c.rs.forEach(function(r){var k=r.date.slice(0,7);(months[k]=months[k]||[]).push(r.kwh)});
  var mk=Object.keys(months).sort().reverse();
  var mt=mk.length?'<div class="tblwrap"><table class="tnum"><thead><tr><th>Bulan</th><th class="r">Hari tercatat</th><th class="r">Total kWh</th><th class="r">Rata-rata/hari</th><th class="r">Perkiraan biaya</th></tr></thead><tbody>'
    +mk.map(function(k){var a=months[k],t=sum(a);return '<tr><td>'+MONF[+k.slice(5)-1]+' '+k.slice(0,4)+'</td><td class="r">'+a.length+'</td><td class="r">'+nf(t,1)+'</td><td class="r">'+nf(t/a.length,1)+'</td><td class="r">'+rp(t*c.unit)+'</td></tr>'}).join("")+"</tbody></table></div>":'<div class="empty">Belum ada catatan.</div>';
  var all=S.readings.slice().sort(function(a,b){return a.date<b.date?1:-1}).slice(0,30);
  var srcL={manual:"Diisi manual",stand:"Dari angka meter",derived:"Dihitung dari selisih meter",sample:"Data contoh",live:"Dari perangkat yang menyala",auto:"Otomatis dari jadwal perangkat"};
  var todayRow=c.todayLive?'<tr><td>Hari ini</td><td class="r">'+nf(c.live,1)+'</td><td class="r">'+rp(c.live*c.unit)+'</td><td class="muted">Otomatis, masih berjalan</td><td></td></tr>':"";
  var rows=(all.length||c.todayLive)?'<div class="tblwrap"><table class="tnum"><thead><tr><th>Tanggal</th><th class="r">kWh</th><th class="r">Biaya</th><th>Sumber</th><th></th></tr></thead><tbody>'+todayRow
    +all.map(function(r){
      return '<tr><td>'+fmtDD(r.date)+'</td><td class="r">'+(r.kwh==null?"-":nf(r.kwh,1))+'</td><td class="r">'+(r.kwh==null?"-":rp(r.kwh*c.unit))+'</td><td class="muted">'+(r.kwh==null?"Angka awal meter "+nf(r.stand,1):(srcL[r.src]||srcL.manual))+'</td><td class="r"><button type="button" class="btn danger sm" data-action="rd-del" data-d="'+r.date+'" aria-label="Hapus catatan '+fmtD(r.date)+'">Hapus</button></td></tr>';
    }).join("")+"</tbody></table></div>":"";
  return '<div class="page"><section class="sec" aria-labelledby="h-rd"><h2 id="h-rd">Catatan meter</h2><p class="muted" style="max-width:62ch">WattWise mencatat pemakaian setiap hari secara otomatis dari jadwal perangkat. Total tiap hari masuk ke daftar ini pukul 00:00, atau begitu halaman dibuka lagi jika sedang tertutup. Isi formulir di bawah hanya jika ingin mengoreksi suatu hari dengan angka dari meter. Jika ada hari yang terlewat, WattWise membagi selisihnya rata ke hari-hari itu.</p>'+form+'</section>'
   +'<section class="sec" aria-labelledby="h-mt"><h2 id="h-mt">Ringkasan per bulan</h2>'+mt+'</section>'
   +exportHTML(mk)+((all.length||c.todayLive)?'<section class="sec" aria-labelledby="h-all"><h2 id="h-all">30 catatan terakhir</h2>'+rows+'</section>':"")+'</div>';
}

/* ---------- Anggaran ---------- */
function viewAnggaran(c){
  var s=S.settings;
  var status=c.budget>0?pill(c.status):"";
  var kwhLeft=Math.max(0,c.budgetKwh-c.mtd);
  var tgt=c.left>0?'Sisa '+c.left+' hari bulan ini termasuk hari ini, jatah maksimal <strong>'+nf(c.targetDaily,1)+' kWh per hari</strong> (rata-rata 7 hari terakhir '+nf(c.avg7,1)+' kWh).':"Bulan ini sudah tercatat penuh.";
  var form='<form class="form panel" data-form="bg" novalidate><h3 class="wide">Anggaran bulanan</h3>'
   +'<div class="field"><label for="bg-amt">Anggaran listrik (Rp per bulan)</label><input id="bg-amt" name="amt" inputmode="numeric" value="'+Math.round(s.budget)+'"></div>'
   +'<div class="field"><label for="bg-al">Beri peringatan di (% anggaran)</label><input id="bg-al" name="al" inputmode="numeric" value="'+s.alertPct+'"></div>'
   +'<div class="wide"><button class="btn" type="submit">Simpan anggaran</button></div><p class="err" role="alert"></p></form>';
  var tk='<div class="panel"><h3>Kalkulator token prabayar</h3><div class="form"><div class="field"><label for="tk-amt">Nominal pembelian (Rp)</label><input id="tk-amt" inputmode="numeric" value="100000"></div></div><p class="tnum" id="tk-out" aria-live="polite"></p><p class="muted small">Perkiraan setelah PPJ '+val(s.ppj)+'%, belum termasuk biaya admin tempat pembelian.</p></div>';
  return '<div class="page"><section class="sec" aria-labelledby="h-bg"><div class="sec-head"><h2 id="h-bg">Anggaran dan target</h2>'+status+'</div>'
   +(c.budget>0?'<dl class="facts tnum"><div><dt>Anggaran</dt><dd>'+rp(c.budget)+' ('+nf(c.budgetKwh,0)+' kWh)</dd></div><div><dt>Terpakai sejauh ini</dt><dd>'+rp(c.mtdCost)+' ('+nf(c.mtd,1)+' kWh)</dd></div><div><dt>Sisa anggaran</dt><dd>'+rp(Math.max(0,c.budget-c.mtdCost))+' ('+nf(kwhLeft,0)+' kWh)</dd></div><div><dt>Proyeksi akhir bulan</dt><dd>'+rp(c.projCost)+' ('+nf(c.ratio*100,0)+'% dari anggaran)</dd></div></dl><p>'+tgt+'</p>':'<div class="empty">Isi anggaran bulanan untuk melihat target harian.</div>')+'</section>'
   +'<div class="cols"><section class="sec">'+form+'</section><section class="sec" aria-labelledby="h-tk"><h2 id="h-tk" class="sr">Token</h2>'+tk+'</section></div></div>';
}
function tokenUpdate(){
  var i=document.getElementById("tk-amt"),o=document.getElementById("tk-out");if(!i||!o)return;
  var c=calc(),a=num(i.value);
  if(!(a>0)){o.textContent="Isi nominal, misalnya 100000.";return}
  var kwh=a/(1+S.settings.ppj/100)/S.settings.tariff;
  o.innerHTML="Dapat sekitar <strong>"+nf(kwh,1)+" kWh</strong>"+(c.avg7>0?", cukup untuk sekitar <strong>"+nf(kwh/c.avg7,0)+" hari</strong> pada pemakaian 7 hari terakhir.":".");
}

/* ---------- Pengaturan ---------- */
function viewPengaturan(c){
  var s=S.settings;

   +'<div class="field"><label for="set-va">Daya terpasang</label><select id="set-va" name="va">'+PRESETS.map(function(p){return '<option value="'+p.va+'"'+(p.va===s.va?" selected":"")+'>'+p.label+'</option>'}).join("")+'</select></div>'

   +'<div class="field"><label for="set-pf">Faktor daya (cos φ)</label><input id="set-pf" name="pf" inputmode="decimal" value="'+val(s.pf)+'"></div>'
   +'<div class="wide field"><span class="hint">Tarif standar di atas berasal dari golongan rumah tangga non-subsidi PLN dan dapat berubah. Cocokkan dengan struk atau aplikasi PLN Anda. PPJ berbeda tiap daerah, lihat di struk.</span></div>'
   +'<div class="wide"><button class="btn" type="submit">Simpan pengaturan</button></div><p class="err" role="alert"></p></form>';
  var th=document.documentElement.dataset.theme||"auto";
  return '<div class="page"><section class="sec" aria-labelledby="h-set"><h2 id="h-set">Pengaturan</h2>'+form+'</section>'

   +'<section class="sec" aria-labelledby="h-dt"><h2 id="h-dt">Data</h2><p class="muted" style="max-width:62ch">Data disimpan di peramban ini. Jika Anda masuk ke Claude, data juga disimpan di server dan tersinkron ke HP dan laptop (lihat status di pojok atas). Orang yang Anda beri akses ke halaman ini ikut bisa membaca data tersebut.</p><div style="display:flex;gap:.6rem;flex-wrap:wrap"><button type="button" class="btn ghost" data-action="sample-load" data-confirm="Klik lagi untuk mengganti semua data">Muat data contoh</button><button type="button" class="btn danger" data-action="all-clear" data-confirm="Klik lagi untuk menghapus semua">Hapus semua data</button></div></section></div>';
}

/* ---------- router & render ---------- */
var VIEWS={ringkasan:viewRingkasan,perangkat:viewPerangkat,catatan:viewCatatan,anggaran:viewAnggaran,pengaturan:viewPengaturan};
var animated=false,curRoute=null;
function route(){var h=location.hash.replace("#","");return VIEWS[h]?h:"ringkasan"}
function navHTML(r,withIcons){
  return ROUTES.map(function(x){return '<a href="#'+x.id+'"'+(x.id===r?' aria-current="page"':"")+'>'+(withIcons?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+x.icon+'</svg>':"")+x.label+'</a>'}).join("");
}
function render(keepScroll){
  var r=route(),y=window.scrollY;
  document.getElementById("view").innerHTML=VIEWS[r](calc());
  document.getElementById("deskNav").innerHTML=navHTML(r,false);
  document.getElementById("tabNav").innerHTML=navHTML(r,true);
  if(r==="perangkat")simSync();
  if(r==="anggaran")tokenUpdate();
  if(r==="ringkasan")updateLiveDOM();
  if(r==="ringkasan"&&!animated){animated=true;animateOdo()}
  if(keepScroll&&curRoute===r)window.scrollTo(0,y);else window.scrollTo(0,0);
  curRoute=r;
}
function animateOdo(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var st=document.querySelectorAll(".strip");
  st.forEach(function(s){s.style.transition="none";s.style.transform="translateY(0)"});
  void document.body.offsetHeight;
  st.forEach(function(s,i){s.style.transition="transform 1.1s cubic-bezier(.2,.8,.2,1) "+(i*0.09)+"s";s.style.transform=""});
}
window.addEventListener("hashchange",function(){render(false)});

/* ---------- toast & tema ---------- */
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2400)}
function applyTheme(m){
  var r=document.documentElement;if(m==="light"||m==="dark")r.dataset.theme=m;else delete r.dataset.theme;
  try{if(m==="auto")localStorage.removeItem(THEME_KEY);else localStorage.setItem(THEME_KEY,m)}catch(e){}
  setThemeIcon();
}
function effTheme(){var t=document.documentElement.dataset.theme;if(t)return t;return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function setThemeIcon(){
  var d=effTheme()==="dark";
  document.getElementById("themeBtn").innerHTML=d?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
}
try{var tm=localStorage.getItem(THEME_KEY);if(tm==="light"||tm==="dark")document.documentElement.dataset.theme=tm}catch(e){}
document.getElementById("themeBtn").addEventListener("click",function(){applyTheme(effTheme()==="dark"?"light":"dark");if(route()==="pengaturan")render(true)});
setThemeIcon();

/* ---------- sinkron server ---------- */
var dbRef=null,syncSt="local",writing=false,dirty=false,pushT=null,loadTimer=null,firstDone=false,pendingRemote=null,lastRemote=null,retried=false;
var SYNC_TXT={local:["","Hanya di peramban ini"],wait:["busy","Menghubungkan..."],busy:["busy","Menyimpan..."],ok:["ok","Tersinkron"],off:["err","Belum terhubung ke server"],err:["err","Gagal menyimpan ke server"],ro:["err","Hanya baca"]};
function setSync(st){
  syncSt=st;var el=document.getElementById("syncState");if(!el)return;
  el.className="sync "+SYNC_TXT[st][0];el.innerHTML='<i aria-hidden="true"></i>'+SYNC_TXT[st][1];
}
function clone(o){return JSON.parse(JSON.stringify(o))}
function pushRemote(){if(!dbRef||syncSt==="ro")return;dirty=true;clearTimeout(pushT);pushT=setTimeout(flush,400);setSync("busy")}
function flush(){
  if(writing||!dirty||!dbRef)return;
  writing=true;dirty=false;
  dbRef.set(clone(S)).then(function(){
    retried=false;writing=false;
    if(dirty)flush();else setSync("ok");
  }).catch(function(e){
    writing=false;var code=e&&e.code;
    if(code==="invalid_argument"){setSync("ro");toast("Anda hanya bisa melihat data ini");if(lastRemote)adopt(lastRemote,true)}
    else if(code==="unavailable"&&!retried){retried=true;dirty=true;setTimeout(flush,1500)}
    else if(code==="revoked"){dbRef=null;setSync("local")}
    else setSync("err");
  });
}
function typing(){
  var ae=document.activeElement,v=document.getElementById("view");
  if(!ae||!v||!v.contains(ae))return false;
  var tg=ae.tagName;if(tg==="SELECT"||tg==="TEXTAREA")return true;
  return tg==="INPUT"&&ae.type!=="checkbox"&&ae.type!=="radio"&&ae.type!=="button";
}
function adopt(d,force){
  if(!force&&typing()){pendingRemote=d;return}
  pendingRemote=null;S=clone(d);norm();if(settle())save();else saveLocal();render(true);
}
document.addEventListener("focusout",function(){
  if(pendingRemote)setTimeout(function(){if(pendingRemote&&!typing())adopt(pendingRemote)},300);
});
function onRemote(snap){
  var md=snap.metadata||{};
  if(!md.fromCache)clearTimeout(loadTimer);
  if(!snap.exists){
    if(!md.fromCache&&!firstDone){firstDone=true;S.updatedAt=Math.max(Date.now(),S.updatedAt||0);saveLocal();dirty=true;setSync("busy");flush()}
    return;
  }
  var d=snap.data();
  if(!d||!d.settings||!d.appliances||!d.readings)return;
  if(md.hasPendingWrites)return;
  lastRemote=d;
  var rt=d.updatedAt||0,lt=S.updatedAt||0;
  if(rt>lt)adopt(d);
  else if(lt>rt&&!md.fromCache&&!firstDone){firstDone=true;dirty=true;setSync("busy");flush();return}
  if(!md.fromCache){firstDone=true;if(syncSt!=="busy"&&syncSt!=="ro")setSync("ok")}
}
function initDb(){
  setSync("local");
  try{
    if(!window.claude||!window.claude.use)return;
    window.claude.use("db").then(function(db){
      if(!db)return;
      dbRef=db.doc("wattwise/state");setSync("wait");
      loadTimer=setTimeout(function(){if(syncSt==="wait")setSync("off")},10000);
      dbRef.onSnapshot(onRemote,function(e){
        clearTimeout(loadTimer);
        if(e&&e.code==="revoked"){dbRef=null;setSync("local")}else setSync("err");
      });
    }).catch(function(){setSync("local")});
  }catch(e){setSync("local")}
}

/* ---------- unduh laporan ---------- */
var dl=null;
function initDl(){
  try{if(window.claude&&window.claude.use)window.claude.use("downloads").then(function(x){dl=x;if(x&&route()==="catatan")render(true)}).catch(function(){})}catch(e){}
}
function csvCell(v){var s=String(v);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function csvRow(a){return a.map(csvCell).join(";")}
function dn(n,d){return Number(n).toFixed(d).replace(".",",")}
function buildCsv(ym){
  var c=calc(),s=S.settings,rows=c.rs.filter(function(r){return r.date.slice(0,7)===ym}),L=[];
  var tot=sum(rows.map(function(r){return r.kwh}));
  L.push(csvRow(["Laporan WattWise",MONF[+ym.slice(5)-1]+" "+ym.slice(0,4)]));
  L.push(csvRow(["Daya terpasang (VA)",s.va]));
  L.push(csvRow(["Tarif per kWh (Rp)",dn(s.tariff,2)]));
  L.push(csvRow(["PPJ (%)",dn(s.ppj,1)]));
  L.push("");
  L.push(csvRow(["Tanggal","kWh","Biaya (Rp)"]));
  rows.forEach(function(r){L.push(csvRow([r.date,dn(r.kwh,2),Math.round(r.kwh*c.unit)]))});
  L.push("");
  L.push(csvRow(["Total kWh",dn(tot,2)]));
  L.push(csvRow(["Perkiraan biaya (Rp)",Math.round(tot*c.unit)]));
  L.push(csvRow(["Hari tercatat",rows.length]));
  if(rows.length)L.push(csvRow(["Rata-rata kWh per hari",dn(tot/rows.length,2)]));
  if(s.budget>0){L.push(csvRow(["Anggaran (Rp)",Math.round(s.budget)]));L.push(csvRow(["Sisa anggaran (Rp)",Math.round(s.budget-tot*c.unit)]))}
  L.push("");
  L.push(csvRow(["Perangkat","Ruangan","Daya (W)","Jumlah","Jam per hari","kWh per bulan","Biaya per bulan (Rp)","Aktif"]));
  S.appliances.forEach(function(a){var k=a.watt*a.qty*a.hours/1000*30;L.push(csvRow([a.n,a.room||"",dn(a.watt,1),a.qty,dn(a.hours,2),dn(k,1),Math.round(k*c.unit),a.on?"Ya":"Tidak"]))});
  return L.join("\r\n");
}
function exportCsv(ym){
  if(!dl){toast("Unduhan tidak tersedia di tampilan ini");return}
  dl.save({filename:"wattwise-"+ym+".csv",data:"﻿"+buildCsv(ym)}).then(function(r){
    if(r&&r.status==="saved")toast("Laporan diunduh");
  }).catch(function(e){if(e&&e.code==="declined")return;toast("Laporan belum bisa diunduh. Coba lagi.")});
}

/* ---------- aksi ---------- */
function armed(btn){
  if(!btn.dataset.confirm)return true;
  if(btn.dataset.armed==="1"){clearTimeout(btn._t);return true}
  btn.dataset.armed="1";btn.dataset.orig=btn.textContent;btn.textContent=btn.dataset.confirm;btn.classList.add("armed");
  btn._t=setTimeout(function(){btn.dataset.armed="0";btn.textContent=btn.dataset.orig;btn.classList.remove("armed")},4000);
  return false;
}
document.addEventListener("click",function(e){
  var bar=e.target.closest(".bar");
  if(bar){var ro=document.getElementById("readout");if(ro){ro.textContent=bar.dataset.t}document.querySelectorAll(".bar.sel").forEach(function(b){b.classList.remove("sel")});bar.classList.add("sel");return}
  var t=e.target.closest("[data-action]");if(!t)return;
  var a=t.dataset.action;
  if(!armed(t))return;
  if(a==="share"){shareMode=t.dataset.v;render(true)}
  else if(a==="theme"){applyTheme(t.dataset.v);render(true)}
  else if(a==="sample-clear"||a==="all-clear"){S.readings=[];S.appliances=[];S.sample=false;S.settledTo=addDays(toYMD(new Date()),-1);editId=null;save();render(false);toast("Data dihapus. Mulai dari tab Perangkat dan Catatan.")}
  else if(a==="sample-load"){var keep=S.settings;S=defaults();S.settings=Object.assign({},S.settings,keep);save();render(true);toast("Data contoh dimuat")}
  else if(a==="ap-edit"){editId=t.dataset.id;render(false);var f=document.getElementById("ap-form-sec");if(f)f.scrollIntoView({block:"center"})}
  else if(a==="ap-cancel"){editId=null;render(true)}
  else if(a==="ap-del"){settle();S.appliances=S.appliances.filter(function(x){return x.id!==t.dataset.id});if(editId===t.dataset.id)editId=null;save();render(true);toast("Perangkat dihapus")}
  else if(a==="rd-del"){S.readings=S.readings.filter(function(x){return x.date!==t.dataset.d});save();render(true);toast("Catatan "+fmtD(t.dataset.d)+" dihapus")}
  else if(a==="export"){exportCsv(document.getElementById("ex-m").value)}
  else if(a==="sim-apply"){
    var sel=document.getElementById("sim-ap"),rng=document.getElementById("sim-h");
    var ap=S.appliances.filter(function(x){return x.id===sel.value})[0];
    if(ap){settle();ap.hours=+rng.value;save();render(true);toast("Jam pakai "+ap.n+" diperbarui")}
  }
});
document.addEventListener("mouseover",function(e){var b=e.target.closest&&e.target.closest(".bar");if(b){var ro=document.getElementById("readout");if(ro)ro.textContent=b.dataset.t}});
document.addEventListener("focusin",function(e){var b=e.target.closest&&e.target.closest(".bar");if(b){var ro=document.getElementById("readout");if(ro)ro.textContent=b.dataset.t}});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.actionChange==="ap-toggle"){
    var a=S.appliances.filter(function(x){return x.id===t.dataset.id})[0];if(a){settle();a.on=t.checked;save();render(true)}
  }else if(t.id==="sim-ap")simSync();
  else if(t.id==="set-va"){var p=PRESETS.filter(function(x){return x.va===+t.value})[0];if(p){document.getElementById("set-t").value=val(p.tariff)}}
  else if(t.name==="mode"){
    var st=t.value==="stand";
    document.getElementById("rd-lab").textContent=st?"Angka di meter (kWh)":"Pemakaian (kWh)";
    document.getElementById("rd-hint").textContent=st?"Isi total kWh yang tertera di meter. Selisih dari angka meter sebelumnya dihitung otomatis dan dibagi rata per hari.":"Isi total kWh yang terpakai pada tanggal itu.";
    document.getElementById("rd-val").placeholder=st?"1234,5":"8,5";
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="sim-h")simUpdate();
  else if(e.target.id==="tk-amt")tokenUpdate();
});

function showErr(f,m){var el=f.querySelector(".err");if(el)el.textContent=m||""}
var FORMS={
  ap:function(f){
    var n=f.elements.n.value.trim(),room=f.elements.room.value.trim(),w=num(f.elements.watt.value),q=Math.round(num(f.elements.qty.value)),h=num(f.elements.hours.value),st=f.elements.start.value||"";
    if(!n)return showErr(f,"Isi nama perangkat, misalnya Dispenser.");
    if(!(w>0))return showErr(f,"Isi daya dalam watt, lebih dari 0.");
    if(!(q>=1))return showErr(f,"Jumlah unit minimal 1.");
    if(!(h>=0&&h<=24))return showErr(f,"Jam pakai harus antara 0 dan 24.");
    var e=S.appliances.filter(function(a){return a.id===editId})[0];
    settle();if(e){e.n=n;e.room=room;e.watt=w;e.qty=q;e.hours=h;e.start=st}else S.appliances.push({id:rid(),n:n,room:room,watt:w,qty:q,hours:h,start:st,on:true});
    editId=null;save();render(true);toast("Perangkat tersimpan");
  },
  rd:function(f){
    var d=f.elements.date.value,mode=f.elements.mode.value,v=num(f.elements.val.value),today=toYMD(new Date());
    if(!d||d>today)return showErr(f,"Pilih tanggal hari ini atau sebelumnya.");
    if(!(v>0))return showErr(f,mode==="stand"?"Isi angka meter lebih dari 0, misalnya 1234,5.":"Isi pemakaian lebih dari 0, misalnya 8,5.");
    v=Math.round(v*100)/100;
    if(mode==="daily"){
      S.readings=S.readings.filter(function(x){return x.date!==d});
      S.readings.push({date:d,kwh:Math.round(v*10)/10,src:"manual"});
      save();render(true);toast("Tersimpan: "+fmtD(d)+", "+nf(v,1)+" kWh");return;
    }
    var prev=S.readings.filter(function(x){return x.stand!=null&&x.date<d}).sort(function(a,b){return a.date<b.date?1:-1})[0];
    if(!prev){
      S.readings=S.readings.filter(function(x){return x.date!==d});
      S.readings.push({date:d,kwh:null,stand:v,src:"stand"});
      save();render(true);toast("Angka awal meter tersimpan. Catatan berikutnya menghitung selisihnya.");return;
    }
    var diff=v-prev.stand;
    if(diff<0)return showErr(f,"Angka ini lebih kecil dari catatan "+fmtD(prev.date)+" ("+nf(prev.stand,1)+"). Periksa kembali angkanya.");
    var days=diffDays(d,prev.date),per=Math.round(diff/days*100)/100;
    S.readings=S.readings.filter(function(x){return !(x.date>prev.date&&x.date<=d)});
    for(var i=1;i<=days;i++){var dd=addDays(prev.date,i);S.readings.push(dd===d?{date:dd,kwh:per,stand:v,src:days>1?"derived":"stand"}:{date:dd,kwh:per,src:"derived"})}
    save();render(true);toast("Tersimpan: "+nf(diff,1)+" kWh selama "+days+" hari");
  },
  bg:function(f){
    var a=num(f.elements.amt.value),p=num(f.elements.al.value);
    if(!(a>0))return showErr(f,"Isi anggaran dalam rupiah, misalnya 380000.");
    if(!(p>=50&&p<=100))return showErr(f,"Batas peringatan antara 50 dan 100 persen.");
    S.settings.budget=Math.round(a);S.settings.alertPct=Math.round(p);save();render(true);toast("Anggaran tersimpan");
  },
  set:function(f){
    var va=+f.elements.va.value,t=num(f.elements.t.value),ppj=num(f.elements.ppj.value),pf=num(f.elements.pf.value);
    if(!(t>0))return showErr(f,"Isi tarif per kWh, misalnya 1444,70.");
    if(!(ppj>=0&&ppj<=30))return showErr(f,"PPJ antara 0 dan 30 persen.");
    if(!(pf>=0.5&&pf<=1))return showErr(f,"Faktor daya antara 0,5 dan 1.");
    S.settings.va=va;S.settings.tariff=t;S.settings.ppj=ppj;S.settings.pf=pf;save();render(true);toast("Pengaturan tersimpan");
  }
};
document.addEventListener("submit",function(e){
  var f=e.target.closest("form[data-form]");if(!f)return;
  e.preventDefault();showErr(f,"");FORMS[f.dataset.form](f);
});

/* ---------- jam: reset 00:00 dan pencatatan otomatis ---------- */
var lastTickDay=toYMD(new Date()),tickN=0;
function rollover(){
  var ch=settle();
  if(ch)save();
  if(!typing())render(true);
  if(ch)toast("Pemakaian kemarin sudah masuk ke Catatan");
}
function tick(){
  var td=toYMD(new Date());
  if(td!==lastTickDay){lastTickDay=td;tickN=0;rollover();return}
  tickN++;
  if(route()==="ringkasan"){updateLiveDOM();if(tickN%10===0)refreshHero();if(tickN%60===0)refreshChart()}
}
if(settle())save();
initDb();initDl();
setInterval(tick,1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});
window.addEventListener("focus",tick);
window.addEventListener("pageshow",tick);
render(false);
})();
</script>
